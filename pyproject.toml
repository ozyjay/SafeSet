[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "safeset"
version = "0.1.0"
description = "Local-first protection and controlled pseudonymisation for research artefacts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.16,<1", "PyYAML>=6.0.2,<7", "cryptography>=44,<51", "openpyxl>=3.1.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]
mac-app = ["pyinstaller>=6.20,<7"]

[project.scripts]
safeset = "safeset.cli:app"
safeset-desktop = "safeset.desktop:main"
safeset-document = "safeset.document_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/safeset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
