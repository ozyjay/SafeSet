[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "safeset"
version = "0.1.0"
description = "Local-first dataset minimisation and controlled pseudonymisation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.16,<1", "PyYAML>=6.0.2,<7", "cryptography>=44,<51"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
safeset = "safeset.cli:app"
safeset-desktop = "safeset.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/safeset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
