version: 3
min_group_size: 2
columns:
  student_name:
    action: drop
    classification: direct_identifier
  student_number:
    action: pseudonymise
    classification: direct_identifier
  email:
    action: drop
    classification: direct_identifier
  campus:
    action: code
    classification: quasi_identifier
    allowed_values: [Moon, Mars]
  subject:
    action: code
    classification: quasi_identifier
    allowed_values: [Imaginary101]
  gpa:
    action: keep_numeric
    classification: quasi_identifier
    bounds: [0, 7]
  notes:
    action: drop
    classification: free_text
